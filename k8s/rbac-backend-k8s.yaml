---
# ServiceAccount for the NestJS backend. IRSA-annotated so the pod
# picks up an AWS IAM identity for `sns:Publish` (SmsService's
# SnsSmsProvider for non-TR SMS routing). The role itself lives in
# `fovi-longa-chat-be/terraform/chatbu-backend-iam.tf` and its trust
# policy allows both `chatbu:backend-sa` (this file, prod) and
# `chatbu-dev:backend-sa` (k8s-dev/rbac.yaml).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  namespace: chatbu
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::152100380489:role/chatbu-backend-sns-role

---
# Role: read pods/logs + restart deployments in chatbu namespace
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-ops-role
  namespace: chatbu
rules:
  # List pods and read logs
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  # Patch deployments (for rollout restart)
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-ops-binding
  namespace: chatbu
subjects:
  - kind: ServiceAccount
    name: backend-sa
    namespace: chatbu
roleRef:
  kind: Role
  name: backend-ops-role
  apiGroup: rbac.authorization.k8s.io
