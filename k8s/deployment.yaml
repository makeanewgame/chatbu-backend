apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
  namespace: chatbu
  labels:
    app: backend
    component: api
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 2
  revisionHistoryLimit: 2
  selector:
    matchLabels:
      app: backend
  template:
    metadata:
      labels:
        app: backend
        component: api
      annotations:
        # Karpenter consolidation was evicting prod backend pods during
        # cluster-wide rebalancing — observed 2026-06-12 prod outage when
        # all stateless pods were drained at once, the cluster ended up
        # with zero Karpenter nodes, CoreDNS couldn't schedule, EC2 API
        # DNS resolution broke for Karpenter, and a chicken-and-egg
        # deadlock kept the cluster down ~20min. Voluntary disruption
        # off; spot interruption (AWS-driven) is unaffected.
        karpenter.sh/do-not-disrupt: "true"
    spec:
      serviceAccountName: backend-sa
      topologySpreadConstraints:
        # Hard spread (DoNotSchedule) so a single node death or a
        # single-AZ outage can't take backend fully down. Added
        # 2026-06-12 after a prod outage where stateless pods packed
        # onto a single node and one node-drain cascaded into a full
        # tier outage. maxSkew=1 forces Karpenter to provision a new
        # node rather than letting two replicas co-locate.
        - maxSkew: 2
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: backend
        - maxSkew: 2
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: DoNotSchedule
          labelSelector:
            matchLabels:
              app: backend
      containers:
      - name: backend
        image: 152100380489.dkr.ecr.eu-central-1.amazonaws.com/chatbu-repo:backend-latest
        imagePullPolicy: Always
        ports:
        - containerPort: 3001
          name: http
        envFrom:
        - secretRef:
            name: backend-secrets
        env:
        - name: NODE_ENV
          value: "production"
        - name: PORT
          value: "3001"
        - name: API_URL
          value: "http://backend:3001"
        - name: FRONTEND_URL
          value: "https://app.chatbu.io"
        - name: CORS_ORIGIN
          value: "https://app.chatbu.io,https://chatbu.io"
        - name: INGEST_ENPOINT
          value: "http://fastapi-gateway-service:8000"
        - name: MCP_API_GATEWAY_URL
          value: "http://fastapi-gateway-service:8000"
        - name: REDIS_URL
          value: "redis://redis-service:6379"
        # Voice message plan Slice A — the backend does NOT consume the
        # chatbu-config ConfigMap wholesale (that map feeds the fovi
        # services: gateway / ml / mcp), so these two keys are pulled in
        # surgically. `optional: true` keeps the pod bootable in any
        # namespace where the map or key is absent — the service treats
        # a missing key as `enabled=false` (kill switch closed).
        # chatbu-config is namespace-relative: prod resolves the chatbu
        # map (ENABLED="false"), chatbu-dev resolves the dev-patched map
        # (ENABLED="true" since the Slice A canary flip).
        - name: VOICE_TRANSCRIBE_ENABLED
          valueFrom:
            configMapKeyRef:
              name: chatbu-config
              key: VOICE_TRANSCRIBE_ENABLED
              optional: true
        - name: VOICE_TRANSCRIBE_LANG_DEFAULT
          valueFrom:
            configMapKeyRef:
              name: chatbu-config
              key: VOICE_TRANSCRIBE_LANG_DEFAULT
              optional: true
        # Owner-echo takeover on Messenger/Instagram (meta.service.ts
        # handleOwnerEcho): when the owner replies from the IG/Messenger
        # inbox app, flip the chat to HUMAN_ACTIVE so the bot yields.
        # Same surgical configMapKeyRef pattern as VOICE_TRANSCRIBE_*
        # above — the backend does not consume chatbu-config wholesale.
        # Missing key/map ⇒ disabled (kill switch closed).
        - name: META_ECHO_TAKEOVER_ENABLED
          valueFrom:
            configMapKeyRef:
              name: chatbu-config
              key: META_ECHO_TAKEOVER_ENABLED
              optional: true
        # Bot-to-bot loop breaker (2026-09-04 incident: two Chatbu-
        # botted IG accounts ping-ponged ~790 messages until the
        # integration was manually disabled). INVERTED semantics vs the
        # other flags: this is a protective control — a missing key
        # means ON. Set the configmap key to "false" only to disable.
        - name: META_LOOP_GUARD_ENABLED
          valueFrom:
            configMapKeyRef:
              name: chatbu-config
              key: META_LOOP_GUARD_ENABLED
              optional: true
        # International SMS routing (Slice 4 prod flip, 2026-09-05).
        # SmsService.pickProvider: route_by_country → TR stays on
        # NETGSM, everything else goes to Twilio (creds arrive via
        # backend-secrets envFrom once the twilio ExternalSecret
        # lands). Missing key = code default netgsm_only, so this is
        # safe in any namespace where the configmap key is absent.
        # The k8s-dev overlay has pinned route_by_country via its own
        # patch since 2026-08-20 and strategic-merge overrides this
        # entry there.
        - name: SMS_PROVIDER_STRATEGY
          valueFrom:
            configMapKeyRef:
              name: chatbu-config
              key: SMS_PROVIDER_STRATEGY
              optional: true
        resources:
          requests:
            memory: "1Gi"
            cpu: "300m"
          limits:
            memory: "2Gi"
            cpu: "1000m"
        livenessProbe:
          httpGet:
            path: /api
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /api
            port: 3001
          initialDelaySeconds: 30
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3