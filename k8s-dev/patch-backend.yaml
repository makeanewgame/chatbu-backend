# Strategic-merge: env is a list keyed by `name`, so these entries
# override just the per-env URLs; all other env vars (already
# namespace-relative bare names from the Step 1 edit) are inherited.
#
# The three Google OAuth redirect URIs are seeded from prod's
# backend-secrets (they aren't GitOps-managed in prod either), so they
# point at app.chatbu.io by default. Without these overrides, a "Login
# with Google" on dev.chatbu.io builds redirect_uri=app.chatbu.io/... and
# Google sends the user back to prod. The dev callback URLs must ALSO be
# added as Authorized redirect URIs on the Google OAuth client (or use a
# separate dev OAuth client) for Google to accept them.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend
spec:
  replicas: 1
  template:
    metadata:
      annotations:
        # Stop Karpenter from draining the dev backend during consolidation.
        # chatbu-dev pods land on the shared spot node group and have no PDB
        # (single-replica dev), so Karpenter was free to evict them every
        # 15-20 minutes, producing intermittent 503s at the ingress while
        # the backend Service had no available endpoint. `do-not-disrupt`
        # disables Karpenter consolidation for the pod. Spot interruption
        # from AWS is unaffected (less frequent, unavoidable).
        karpenter.sh/do-not-disrupt: "true"
    spec:
      containers:
        - name: backend
          env:
            - name: FRONTEND_URL
              value: "https://dev.chatbu.io"
            - name: CORS_ORIGIN
              value: "https://dev.chatbu.io"
            - name: FRONTEND_GOOGLE_REDIRECT_URI
              value: "https://dev.chatbu.io/auth/google/redirect"
            - name: GOOGLE_REDIRECT_URI
              value: "https://dev.chatbu.io/api/auth/google/redirect"
            - name: GOOGLE_CALENDAR_REDIRECT_URI
              value: "https://dev.chatbu.io/api/integration/google-calendar/callback"
            # SMS provider routing (Slice 2, 2026-08-13). When set to
            # `route_by_country`, `SmsService.pickProvider` sends TR
            # phones to NETGSM and everything else to `SnsSmsProvider`
            # (AWS SNS). The SNS client picks up IRSA credentials
            # automatically from the backend-sa service account (IAM
            # role `chatbu-backend-sns-role`, granted `sns:Publish` by
            # fovi-longa-chat-be/terraform/chatbu-backend-iam.tf).
            # Prod stays on the default `netgsm_only` (unset here →
            # SmsService constructor default) until the Slice 4
            # prod-flip PR.
            - name: SMS_PROVIDER_STRATEGY
              value: "route_by_country"
            # SNS dev escape hatch (mirror of NETGSM_MOCK). "false"
            # (this line) → real SNS Publish calls. IMPORTANT: the
            # account is in SNS SMS sandbox until the prod-access
            # ticket clears, so real sends will FAIL with a
            # "destination phone number is not verified" error
            # unless the target number is whitelisted first via
            # `aws sns create-sms-sandbox-phone-number --phone-number
            # +… --profile datalonga --region eu-central-1` (round-
            # trip: an SMS with a 6-digit code arrives at the target,
            # `verify-sms-sandbox-phone-number` completes the pair).
            # Whitelisted numbers work end-to-end; unwhitelisted ones
            # surface the sandbox error to `SmsService.sendSms`
            # (counter increments outcome=failure, LeadService turns
            # it into the LEAD_SMS_VERIFICATION_UNAVAILABLE sentinel
            # the same way NETGSM transport failures do).
            - name: SNS_MOCK
              value: "false"
            # Alphanumeric sender ID for countries that support it
            # (most of EU/APAC). US ignores this and falls back to
            # SNS-picked long code automatically. Kept short + branded.
            - name: SNS_SENDER_ID
              value: "Chatbu"