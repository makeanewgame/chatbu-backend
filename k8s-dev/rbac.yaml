# backend RBAC for the dev namespace. The prod base kustomization (k8s/) does
# NOT include rbac-backend-k8s.yaml, so it cannot be pulled in as a base
# resource; this is a small dev-local copy (namespace is injected by the
# overlay's namespace transformer → chatbu-dev). backend pods run as
# serviceAccountName: backend-sa and would fail to start without it.
#
# IRSA annotation is stable — role_name is fixed in
# `fovi-longa-chat-be/terraform/chatbu-backend-iam.tf`; the trust policy
# there lists both `chatbu:backend-sa` (prod) and `chatbu-dev:backend-sa`
# (this file), so the same role ARN works for both namespaces. Grants
# `sns:Publish` for `SmsService.SnsSmsProvider` (international SMS
# routing under `SMS_PROVIDER_STRATEGY=route_by_country`).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: backend-sa
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::152100380489:role/chatbu-backend-sns-role
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: backend-ops-role
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: backend-ops-binding
subjects:
  - kind: ServiceAccount
    name: backend-sa
roleRef:
  kind: Role
  name: backend-ops-role
  apiGroup: rbac.authorization.k8s.io
